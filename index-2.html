<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WINSTAR勤怠</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#eef0f4; --surface:#ffffff; --ink:#141b2d; --muted:#5b6478; --line:#d5d9e3; --soft:#e4e8f0;
  --navy:#1c2a4a; --gold:#b8860b; --gold-soft:#f5ead2;
  --in:#1d5c8f; --out:#a2492b; --warn:#a33b2b; --warn-soft:#f6e3df;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1420; --surface:#182033; --ink:#e7ebf3; --muted:#9aa3b8; --line:#2a3550; --soft:#1f2941;
  --navy:#2f4370; --gold:#e0b04a; --gold-soft:#3a3120;
  --in:#4c8fd0; --out:#d0704f; --warn:#ef8a78; --warn-soft:#3a201c; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-inline:16px;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-weight:900;letter-spacing:.08em;font-size:18px}
.brand i{color:var(--gold);font-style:normal;margin-right:6px}
.brand small{font-weight:500;letter-spacing:.02em;color:var(--muted);font-size:13px;margin-left:6px}
.link{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;color:var(--muted)}
.clock{background:var(--navy);color:#fff;border-radius:16px;padding:20px}
.clock .date{font-size:15px;opacity:.85}
.clock .time{font-family:var(--f-num);font-size:clamp(48px,14vw,72px);font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums}
.big{border:none;border-radius:16px;padding:22px;font-size:24px;font-weight:900;color:#fff;background:var(--navy);width:100%}
.big.in{background:var(--in)} .big.out{background:var(--out)}
.big:disabled{opacity:.5}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.panel h3{margin:0;font-size:13px;color:var(--muted);letter-spacing:.06em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--soft);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700;display:flex;gap:6px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.chip .num{color:var(--muted);font-weight:500}
.empty,.note{color:var(--muted);font-size:14px}
.alert{background:var(--warn-soft);color:var(--warn);padding:12px;border-radius:10px;font-weight:700;font-size:14px}

.sheet{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:10;
  padding-inline:16px;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px))}
.head{display:flex;justify-content:space-between;align-items:center}
.badge{font-weight:900;padding:4px 14px;border-radius:999px;color:#fff;background:var(--navy);font-size:15px}
.back{background:none;border:none;color:var(--muted);font-weight:700;font-size:15px;padding:8px}
.prompt{font-size:20px;font-weight:700;text-align:center}
.dots{display:flex;justify-content:center;gap:16px}
.dots span{width:18px;height:18px;border-radius:50%;border:2px solid var(--muted)}
.dots span.on{background:var(--ink);border-color:var(--ink)}
.msg{min-height:24px;text-align:center;color:var(--warn);font-weight:700;font-size:15px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:340px;margin:0 auto;width:100%}
.pad button{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 0;font-family:var(--f-num);font-size:26px;font-weight:600}
.pad button.sm{font-family:var(--f-body);font-size:15px;font-weight:700;color:var(--muted)}
.who{text-align:center}
.who b{display:block;font-size:30px}
.dest{background:var(--gold-soft);border-radius:14px;padding:14px 16px}
.dest.sub{background:var(--surface);border:1px solid var(--line)}
.dest .lbl{display:block;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.dest .val{font-size:22px;font-weight:900}
.dest .val .num{font-weight:600;margin-left:10px}
.notice{background:var(--surface);border:2px solid var(--gold);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.nhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.nhead b{font-size:18px}
.done{text-align:center;padding-block:48px;display:flex;flex-direction:column;gap:6px}
.done .mark{font-size:34px;font-weight:900}
.done .t{font-family:var(--f-num);font-size:56px;font-weight:600}

.tabs{display:flex;gap:6px;background:var(--soft);padding:4px;border-radius:12px}
.tabs button{flex:1;border:none;background:none;border-radius:9px;padding:10px;font-weight:700;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16px;min-width:0}
.btn{border:none;border-radius:10px;padding:10px 16px;font-weight:700;background:var(--navy);color:#fff}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.del{background:none;color:var(--warn);padding:6px 8px}
.arow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) 112px;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.arow b{min-width:0}
@media (max-width:480px){.arow{grid-template-columns:1fr 112px}.arow b{grid-column:1/-1}}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--muted);background:var(--soft)}
tr:last-child td{border-bottom:none}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-weight:700}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--bg);border-radius:10px;padding:6px 12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:12px 20px;border-radius:999px;font-weight:700;z-index:30;max-width:calc(100% - 32px)}
</style>
</head>
<body>

<!-- ===== ホーム ===== -->
<div class="wrap" id="home">
  <div class="top">
    <div class="brand"><i>★</i>WINSTAR<small>勤怠</small></div>
    <button class="link" id="openMaster">管理者</button>
  </div>
  <div class="alert" id="offline" hidden>データに接続できません。電波を確認して、ページを開き直してください。</div>
  <div class="clock"><div class="date" id="cDate">&nbsp;</div><div class="time" id="cTime">--:--</div></div>
  <div class="notice" id="notice" hidden>
    <div class="nhead"><b id="nName"></b><button class="link" id="nSwitch">別の人に切り替え</button></div>
    <div class="dest"><span class="lbl" id="nTmrLbl">明日の出勤先</span><span class="val" id="nTmr">—</span></div>
    <div class="note" id="nToday"></div>
  </div>
  <p class="note" id="noticeHint" style="margin:0" hidden>一度この端末で打刻すると、ここに明日の出勤先が表示されます。</p>
  <button class="big" id="btnStart">打刻する</button>
  <div class="panel">
    <h3>いま出勤中</h3>
    <div class="chips" id="onduty"><span class="empty">読み込み中…</span></div>
  </div>
</div>

<!-- ===== コード入力 ===== -->
<div class="sheet" id="pinSheet" hidden>
  <div class="wrap">
    <div class="head"><span class="badge" id="pinBadge">打刻</span><button class="back" data-close>← 戻る</button></div>
    <div class="prompt" id="pinPrompt">4桁のコードを入力</div>
    <div class="dots" id="dots"><span></span><span></span><span></span><span></span></div>
    <div class="msg" id="pinMsg"></div>
    <div class="pad" id="pad"></div>
  </div>
</div>

<!-- ===== 従業員の画面 ===== -->
<div class="sheet" id="meSheet" hidden>
  <div class="wrap">
    <div class="head"><span class="badge">打刻</span><button class="back" data-close>← やめる</button></div>
    <div class="who"><span class="note" id="meState"></span><b id="meName"></b></div>
    <div class="dest"><span class="lbl" id="todayLbl">今日の出勤先</span><span class="val" id="todayVal">—</span></div>
    <div class="msg" id="meMsg"></div>
    <button class="big" id="btnPunch">出勤する</button>
    <div class="dest sub"><span class="lbl" id="tmrLbl">明日の出勤先</span><span class="val" id="tmrVal">—</span></div>
    <div class="panel">
      <h3 id="histTitle">今月の出勤記録</h3>
      <div class="tbl"><table><thead><tr><th>日付</th><th>出勤先</th><th>出勤</th><th>退勤</th></tr></thead><tbody id="meRows"></tbody></table></div>
    </div>
  </div>
</div>

<!-- ===== 完了 ===== -->
<div class="sheet" id="doneSheet" hidden>
  <div class="wrap">
    <div class="done"><div class="mark" id="dnMark"></div><b id="dnName"></b><div class="t" id="dnTime"></div><div class="note" id="dnNote"></div></div>
    <button class="big" data-close>閉じる</button>
  </div>
</div>

<!-- ===== 管理者 ===== -->
<div class="sheet" id="mSheet" hidden>
  <div class="wrap">
    <div class="head"><span class="badge">管理者</span><button class="back" data-close>← 閉じる</button></div>
    <div class="tabs">
      <button data-tab="tAssign" aria-selected="true">出勤連絡</button>
      <button data-tab="tHist" aria-selected="false">履歴</button>
    </div>

    <section id="tAssign" class="wrap" style="width:100%">
      <div class="row"><input type="date" class="field" id="aDate" aria-label="日付"><b id="aDateLbl"></b></div>
      <div class="wrap" id="aList" style="gap:8px;width:100%"></div>
      <button class="big" id="aSave">この日の出勤連絡を保存</button>
      <p class="note" style="margin:0">ゴルフ場を「休み」にした人は休みになります。保存すると従業員の画面に出ます。</p>

      <div class="panel">
        <h3>従業員の登録</h3>
        <div class="row"><input class="field" id="eName" placeholder="名前" style="flex:2"><input class="field" id="ePin" placeholder="4桁コード" inputmode="numeric" maxlength="4" style="flex:1;width:110px"><button class="btn" id="eAdd">追加</button></div>
        <div class="msg" id="eMsg" style="text-align:left;min-height:0"></div>
        <div class="wrap" id="eList" style="gap:6px;width:100%"></div>
      </div>
      <div class="panel">
        <h3>ゴルフ場の登録</h3>
        <div class="row"><input class="field" id="cName" placeholder="コース名" style="flex:1"><button class="btn" id="cAdd">追加</button></div>
        <div class="wrap" id="cList" style="gap:6px;width:100%"></div>
      </div>
      <button class="btn ghost" id="keyChange">マスターキーを変更する</button>
    </section>

    <section id="tHist" class="wrap" style="width:100%" hidden>
      <div class="row">
        <select class="field" id="hMonth" aria-label="月"></select>
        <select class="field" id="hEmp" aria-label="従業員"><option value="">全員</option></select>
      </div>
      <div class="note" id="hSum"></div>
      <div class="tbl"><table><thead><tr><th>日付</th><th>名前</th><th>出勤先</th><th>出勤</th><th>退勤</th></tr></thead><tbody id="hRows"></tbody></table></div>
    </section>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ★★★ ここにFirebaseの設定を貼り付けてください（設定手順.md の手順3） ★★★ */
const firebaseConfig = {
  apiKey: "AIzaSyD6l0DeE-Sb6TmMiMG1sPmxAnczg_XDw4E",
  authDomain: "winstar-kintai.firebaseapp.com",
  projectId: "winstar-kintai",
  storageBucket: "winstar-kintai.firebasestorage.app",
  messagingSenderId: "540635105776",
  appId: "1:540635105776:web:b0e42d5d606e68a02ef535"
};
/* ★★★ ここまで ★★★ */

const $=id=>document.getElementById(id);
const pad2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const WD='日月火水木金土';
const md=s=>{const [y,m,d]=s.split('-').map(Number);return `${m}/${d}(${WD[new Date(y,m-1,d).getDay()]})`};
const hm=iso=>{if(!iso)return'';const d=new Date(iso);return pad2(d.getHours())+':'+pad2(d.getMinutes())};
const today=()=>ymd(new Date()), tomorrow=()=>ymd(addDays(new Date(),1));
function el(tag,attrs,...kids){const e=document.createElement(tag);for(const k in attrs||{}){if(k==='class')e.className=attrs[k];else if(k.startsWith('on'))e.addEventListener(k.slice(2),attrs[k]);else e.setAttribute(k,attrs[k]);}kids.flat().forEach(c=>c!=null&&e.append(c));return e}
function toast(t){const x=$('toast');x.textContent=t;x.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>x.hidden=true,2600)}
function show(id){document.querySelectorAll('.sheet').forEach(s=>s.hidden=s.id!==id)}
function closeAll(){document.querySelectorAll('.sheet').forEach(s=>s.hidden=true)}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeAll);

/* 時計 */
function tick(){const n=new Date();$('cDate').textContent=`${n.getFullYear()}年${n.getMonth()+1}月${n.getDate()}日（${WD[n.getDay()]}）`;$('cTime').textContent=pad2(n.getHours())+':'+pad2(n.getMinutes())}
tick();setInterval(tick,5000);

/* データ */
let db=null, settings={}, employees=[], courses=[], openPunches=[], assign={};
const empById=id=>employees.find(e=>e.id===id);
const courseName=id=>(courses.find(c=>c.id===id)||{}).name||'';

/* 出勤先の表示 */
function putDest(node,date,empId){
  node.replaceChildren();
  if(!(date in assign)){node.textContent='まだ連絡がありません';return}
  const a=assign[date][empId];
  if(!a||!a.course){node.textContent='休み';return}
  node.append(courseName(a.course)||'（削除されたコース）');
  if(a.time)node.append(' ',el('span',{class:'num'},a.time+' 集合'));
}

/* コード入力 */
let pinVal='',pinCb=null;
['1','2','3','4','5','6','7','8','9','clr','0','del'].forEach(k=>{
  const b=el('button',{class:k.length>1?'sm':''},k==='clr'?'クリア':k==='del'?'1字消す':k);
  b.onclick=()=>{if(k==='clr')pinVal='';else if(k==='del')pinVal=pinVal.slice(0,-1);else if(pinVal.length<4)pinVal+=k;
    $('pinMsg').textContent='';drawDots();if(pinVal.length===4){const v=pinVal;setTimeout(()=>pinCb&&pinCb(v),120)}};
  $('pad').append(b);
});
function drawDots(){[...$('dots').children].forEach((s,i)=>s.classList.toggle('on',i<pinVal.length))}
function openPin(badge,prompt,cb){pinVal='';pinCb=cb;drawDots();$('pinMsg').textContent='';$('pinBadge').textContent=badge;$('pinPrompt').textContent=prompt;show('pinSheet')}
function pinError(t){$('pinMsg').textContent=t;pinVal='';drawDots()}

/* ===== 従業員：打刻 ===== */
let me=null, meOpen=null;
$('btnStart').onclick=()=>{
  if(!db)return toast('データに接続できません');
  if(!employees.length)return toast('従業員が未登録です。管理者に登録してもらってください');
  openPin('打刻','4桁のコードを入力',pin=>{
    const emp=employees.find(e=>e.pin===pin);
    if(!emp)return pinError('コードが見つかりません');
    me=emp;saveMe(emp.id);openMe();
  });
};
function openMe(){
  meOpen=openPunches.find(p=>p.empId===me.id)||null;
  $('meName').textContent=me.name+' さん';
  $('meState').textContent=meOpen?`${md(meOpen.date)} ${hm(meOpen.inAt)} から出勤中`:'まだ出勤していません';
  if(meOpen&&meOpen.courseName){$('todayLbl').textContent='出勤中の場所';$('todayVal').textContent=meOpen.courseName}
  else{$('todayLbl').textContent='今日 '+md(today())+' の出勤先';putDest($('todayVal'),today(),me.id)}
  $('tmrLbl').textContent='明日 '+md(tomorrow())+' の出勤先';putDest($('tmrVal'),tomorrow(),me.id);
  const b=$('btnPunch');b.className='big '+(meOpen?'out':'in');b.textContent=meOpen?'退勤する':'出勤する';b.disabled=false;
  $('meMsg').textContent='';
  show('meSheet');loadMyHistory();
}
$('btnPunch').onclick=async()=>{
  const b=$('btnPunch');if(b.disabled)return;b.disabled=true;
  const t=new Date(), out=!!meOpen;
  try{
    if(!out){
      const a=(assign[today()]||{})[me.id];
      await db.collection('punches').add({empId:me.id,empName:me.name,date:today(),inAt:t.toISOString(),outAt:null,open:true,
        courseName:a&&a.course?courseName(a.course):''});
    }else{
      await db.collection('punches').doc(meOpen.id).update({outAt:t.toISOString(),open:false});
    }
    $('dnMark').textContent=out?'退勤しました':'出勤しました';
    $('dnMark').style.color=out?'var(--out)':'var(--in)';
    $('dnName').textContent=me.name+' さん';$('dnTime').textContent=hm(t.toISOString());
    $('dnNote').textContent=out?'おつかれさまでした':'今日もよろしくお願いします';
    show('doneSheet');clearTimeout(window._dn);window._dn=setTimeout(closeAll,4000);
  }catch(e){b.disabled=false;$('meMsg').textContent='保存できませんでした。もう一度押してください'}
};
async function loadMyHistory(){
  const tb=$('meRows'),m=today().slice(0,7);
  $('histTitle').textContent=`${Number(m.slice(5))}月の出勤記録`;
  tb.replaceChildren(el('tr',{},el('td',{colspan:'4',class:'empty'},'読み込み中…')));
  try{
    const s=await db.collection('punches').where('empId','==',me.id).get();
    const rows=s.docs.map(d=>({id:d.id,...d.data()})).filter(p=>p.date.startsWith(m)).sort((a,b)=>a.inAt<b.inAt?1:-1);
    $('histTitle').textContent+=`（${rows.length}日）`;
    tb.replaceChildren();
    if(!rows.length)tb.append(el('tr',{},el('td',{colspan:'4',class:'empty'},'今月の記録はまだありません')));
    rows.forEach(p=>tb.append(el('tr',{},el('td',{},md(p.date)),el('td',{},p.courseName||'—'),el('td',{class:'num'},hm(p.inAt)),el('td',{class:'num'},p.outAt?hm(p.outAt):el('span',{class:'tag'},'出勤中')))));
  }catch(e){tb.replaceChildren(el('tr',{},el('td',{colspan:'4',class:'empty'},'読み込めませんでした')))}
}

/* ホームのお知らせ（この端末の人の明日の出勤先） */
const ME_KEY='kintai_me';
function savedMe(){try{return localStorage.getItem(ME_KEY)}catch(e){return null}}
function saveMe(id){try{localStorage.setItem(ME_KEY,id)}catch(e){}renderNotice()}
$('nSwitch').onclick=()=>{try{localStorage.removeItem(ME_KEY)}catch(e){}renderNotice()};
function renderNotice(){
  const emp=db&&empById(savedMe());
  $('notice').hidden=!emp;$('noticeHint').hidden=!!emp||!db;
  if(!emp)return;
  $('nName').textContent=emp.name+' さんへのお知らせ';
  $('nTmrLbl').textContent='明日 '+md(tomorrow())+' の出勤先';
  putDest($('nTmr'),tomorrow(),emp.id);
  const t=document.createElement('span');putDest(t,today(),emp.id);
  $('nToday').textContent='今日 '+md(today())+'：'+t.textContent;
}

/* いま出勤中 */
function renderOnDuty(){
  const box=$('onduty');box.replaceChildren();
  if(!openPunches.length)return box.append(el('span',{class:'empty'},'出勤中の人はいません'));
  [...openPunches].sort((a,b)=>a.inAt<b.inAt?-1:1).forEach(p=>box.append(
    el('span',{class:'chip'},(empById(p.empId)||{}).name||p.empName,el('span',{class:'num'},hm(p.inAt)+'〜'),p.courseName?el('span',{class:'num'},p.courseName):null)));
}

/* ===== 管理者 ===== */
$('openMaster').onclick=()=>{
  if(!db)return toast('データに接続できません');
  if(!settings.masterKey){
    openPin('管理者','マスターキー（4桁）を新しく決めてください',k1=>openPin('管理者','確認のためもう一度入力',k2=>{
      if(k1!==k2)return pinError('一致しません。戻って最初からやり直してください');
      db.doc('config/settings').set({masterKey:k1}).then(()=>{openMaster();toast('マスターキーを設定しました')}).catch(()=>pinError('保存できませんでした'));
    }));
    return;
  }
  openPin('管理者','マスターキーを入力',k=>k===settings.masterKey?openMaster():pinError('マスターキーが違います'));
};
function openMaster(){show('mSheet');if(!$('aDate').value)$('aDate').value=tomorrow();loadAssign();renderLists()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('[data-tab]').forEach(x=>{x.setAttribute('aria-selected',x===b);$(x.dataset.tab).hidden=x!==b});
  if(b.dataset.tab==='tHist')loadHist();
});

/* 出勤連絡 */
let draft={};
$('aDate').onchange=loadAssign;
async function loadAssign(){
  const d=$('aDate').value;if(!d)return;
  $('aDateLbl').textContent=md(d)+(d===tomorrow()?' 明日':d===today()?' 今日':'');
  let items={};
  try{const s=await db.doc('assign/'+d).get();if(s.exists)items=s.data().items||{}}catch(e){}
  draft=JSON.parse(JSON.stringify(items));renderAssign();
}
function renderAssign(){
  const box=$('aList');box.replaceChildren();
  if(!employees.length)return box.append(el('p',{class:'empty'},'下の「従業員の登録」で追加すると、ここに並びます。'));
  if(!courses.length)box.append(el('p',{class:'empty'},'下の「ゴルフ場の登録」でコースを追加してください。'));
  employees.forEach(e=>{
    const a=draft[e.id]||{};
    const sel=el('select',{class:'field','aria-label':e.name+'の出勤先'},el('option',{value:''},'休み'),...courses.map(c=>el('option',{value:c.id},c.name)));
    sel.value=a.course||'';
    const tm=el('input',{type:'time',class:'field','aria-label':e.name+'の時間'});tm.value=a.time||'';
    sel.onchange=()=>draft[e.id]={...(draft[e.id]||{}),course:sel.value};
    tm.onchange=()=>draft[e.id]={...(draft[e.id]||{}),time:tm.value};
    box.append(el('div',{class:'arow'},el('b',{},e.name),sel,tm));
  });
}
$('aSave').onclick=async()=>{
  const d=$('aDate').value;if(!d)return;
  const items={};for(const id in draft)if(draft[id].course&&empById(id))items[id]={course:draft[id].course,time:draft[id].time||''};
  $('aSave').disabled=true;
  try{await db.doc('assign/'+d).set({items});watchAssign(d);toast(md(d)+' の出勤連絡を保存しました')}catch(e){toast('保存できませんでした')}
  $('aSave').disabled=false;
};

/* 従業員・ゴルフ場の登録 */
let delWait=null;
function delTwice(key,label,fn){
  if(delWait===key){delWait=null;fn().then(()=>toast(label+' を削除しました')).catch(()=>toast('削除できませんでした'));return}
  delWait=key;setTimeout(()=>{if(delWait===key)delWait=null},3000);toast(`もう一度「削除」を押すと ${label} を削除します`);
}
function renderLists(){
  $('eList').replaceChildren(...(employees.length?employees.map(e=>el('div',{class:'li'},el('span',{},e.name+'　',el('span',{class:'num'},e.pin)),
    el('button',{class:'btn del',onclick:()=>delTwice('e'+e.id,e.name,()=>db.collection('employees').doc(e.id).delete())},'削除'))):[el('span',{class:'empty'},'まだ登録がありません')]));
  $('cList').replaceChildren(...(courses.length?courses.map(c=>el('div',{class:'li'},el('span',{},c.name),
    el('button',{class:'btn del',onclick:()=>delTwice('c'+c.id,c.name,()=>db.collection('courses').doc(c.id).delete())},'削除'))):[el('span',{class:'empty'},'まだ登録がありません')]));
  const h=$('hEmp'),v=h.value;h.replaceChildren(el('option',{value:''},'全員'),...employees.map(e=>el('option',{value:e.id},e.name)));h.value=v;
  if(!$('mSheet').hidden&&!$('tAssign').hidden)renderAssign();
}
$('eAdd').onclick=async()=>{
  const name=$('eName').value.trim(),pin=$('ePin').value.trim().replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)),m=$('eMsg');
  m.textContent='';
  if(!name)return m.textContent='名前を入力してください';
  if(!/^\d{4}$/.test(pin))return m.textContent='コードは数字4桁です';
  if(employees.some(e=>e.pin===pin))return m.textContent='このコードは他の人が使っています';
  if(pin===settings.masterKey)return m.textContent='マスターキーと同じコードは使えません';
  try{await db.collection('employees').add({name,pin,createdAt:new Date().toISOString()});$('eName').value='';$('ePin').value='';toast(name+' さんを登録しました')}
  catch(e){m.textContent='登録できませんでした'}
};
$('cAdd').onclick=async()=>{
  const name=$('cName').value.trim();if(!name)return;
  try{await db.collection('courses').add({name,createdAt:new Date().toISOString()});$('cName').value='';toast(name+' を追加しました')}
  catch(e){toast('追加できませんでした')}
};
$('keyChange').onclick=()=>openPin('管理者','新しいマスターキー（4桁）',k1=>{
  if(employees.some(e=>e.pin===k1))return pinError('従業員のコードと同じものは使えません');
  openPin('管理者','確認のためもう一度入力',k2=>{
    if(k1!==k2)return pinError('一致しません。戻って最初からやり直してください');
    db.doc('config/settings').set({masterKey:k1}).then(()=>{show('mSheet');toast('マスターキーを変更しました')}).catch(()=>pinError('保存できませんでした'));
  });
});

/* 履歴 */
(()=>{const n=new Date();for(let i=0;i<12;i++){const d=new Date(n.getFullYear(),n.getMonth()-i,1);$('hMonth').append(el('option',{value:d.getFullYear()+'-'+pad2(d.getMonth()+1)},`${d.getFullYear()}年${d.getMonth()+1}月`))}})();
$('hMonth').onchange=loadHist;$('hEmp').onchange=loadHist;
async function loadHist(){
  const tb=$('hRows'),m=$('hMonth').value,emp=$('hEmp').value;
  tb.replaceChildren(el('tr',{},el('td',{colspan:'5',class:'empty'},'読み込み中…')));
  try{
    const s=await db.collection('punches').where('date','>=',m+'-01').where('date','<=',m+'-31').get();
    let rows=s.docs.map(d=>({id:d.id,...d.data()}));
    if(emp)rows=rows.filter(p=>p.empId===emp);
    rows.sort((a,b)=>a.inAt<b.inAt?1:-1);
    $('hSum').textContent=emp?`出勤 ${rows.length}日`:`${rows.length}件（${new Set(rows.map(r=>r.empId)).size}名）`;
    tb.replaceChildren();
    if(!rows.length)tb.append(el('tr',{},el('td',{colspan:'5',class:'empty'},'この月の記録はありません')));
    rows.forEach(p=>tb.append(el('tr',{},el('td',{},md(p.date)),el('td',{},(empById(p.empId)||{}).name||p.empName),el('td',{},p.courseName||'—'),
      el('td',{class:'num'},hm(p.inAt)),el('td',{class:'num'},p.outAt?hm(p.outAt):el('span',{class:'tag'},'出勤中')))));
  }catch(e){tb.replaceChildren(el('tr',{},el('td',{colspan:'5',class:'empty'},'読み込めませんでした')))}
}

/* ===== 接続 ===== */
const watching={};
function watchAssign(d){if(watching[d])return;watching[d]=db.doc('assign/'+d).onSnapshot(s=>{if(s.exists)assign[d]=s.data().items||{};else delete assign[d];renderNotice()},()=>{})}
function offline(){$('offline').hidden=false;$('onduty').replaceChildren(el('span',{class:'empty'},'—'))}
(async()=>{
  if(!firebaseConfig.apiKey){$('offline').textContent='Firebaseの設定がまだ入っていません（設定手順.md を見てください）';return offline()}
  try{
    firebase.initializeApp(firebaseConfig);
    await firebase.auth().signInAnonymously();
    db=firebase.firestore();
  }catch(e){return offline()}
  db.doc('config/settings').onSnapshot(s=>settings=s.exists?s.data():{},offline);
  db.collection('employees').orderBy('createdAt').onSnapshot(s=>{employees=s.docs.map(d=>({id:d.id,...d.data()}));renderLists();renderNotice()},offline);
  db.collection('courses').orderBy('createdAt').onSnapshot(s=>{courses=s.docs.map(d=>({id:d.id,...d.data()}));renderLists();renderNotice()},offline);
  db.collection('punches').where('open','==',true).onSnapshot(s=>{openPunches=s.docs.map(d=>({id:d.id,...d.data()}));renderOnDuty()},offline);
  [today(),tomorrow()].forEach(watchAssign);
  setInterval(()=>{[today(),tomorrow()].forEach(watchAssign);renderNotice()},60000);
})();
</script>
</body>
</html>
